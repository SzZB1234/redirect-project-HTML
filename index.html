<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Átirányító kezelő</title>
  <style>
    :root{
      --bg:#f5f7fa;
      --card:#ffffff;
      --accent:#2563eb;
      --accent-light:#dbeafe;
      --border:#e5e7eb;
      --text:#1f2937;
      --muted:#6b7280;
      --danger:#dc2626;
      --success:#16a34a;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    .container{max-width:920px;margin:36px auto;padding:18px}
    .card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);box-shadow:0 6px 18px rgba(15,23,42,0.06)}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    h1{margin:0;font-size:20px}
    .subtitle{margin-top:6px;color:var(--muted);font-size:13px}
    .status{font-weight:700;padding:8px 12px;border-radius:10px;background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);display:inline-block}
    .section{margin-top:18px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
    .current-url{background:#f9fafb;border:1px dashed var(--border);padding:12px;border-radius:10px;word-break:break-all}
    .top-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
    .btn{padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:700;font-size:14px}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--accent)}
    .btn-muted{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent)}
    .admin{margin-top:18px;padding:14px;border-radius:10px;background:#fbfdff;border:1px solid var(--border)}
    input[type="text"]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px}
    .admin-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
    .message{margin-top:12px;font-size:14px;color:var(--muted);min-height:20px}
    .message.ok{color:var(--success)}
    .message.err{color:var(--danger)}
    footer{margin-top:14px;text-align:right;color:var(--muted);font-size:13px}
    @media(max-width:640px){header{flex-direction:column;align-items:stretch}.top-actions{flex-direction:column}.admin-row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="app">
      <header>
        <div>
          <h1>Átirányító kezelő</h1>
          <div class="subtitle">Cloudflare Worker backendre optimalizált frontend — gyors és stabil.</div>
        </div>
        <div class="status" id="status">Státusz: ellenőrzés…</div>
      </header>

      <div class="section">
        <label>Jelenlegi átirányítási URL</label>
        <div id="currentUrl" class="current-url">Betöltés…</div>

        <div class="top-actions" style="margin-top:12px">
          <button id="redirectBtn" class="btn btn-primary">Átirányítás most</button>
          <button id="copyBtn" class="btn btn-muted">URL másolása</button>
        </div>

        <div id="message" class="message" aria-live="polite"></div>
      </div>

      <div class="section admin">
        <label>Admin szekció</label>
        <div class="admin-row">
          <button id="openWorkerBtn" class="btn btn-ghost">Worker getUrl megnyitása</button>

          <div style="flex:1;min-width:220px">
            <label for="newUrl">URL módosítása</label>
            <input id="newUrl" type="text" placeholder="https://pelda.hu" />
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;min-width:140px">
            <button id="saveBtn" class="btn btn-primary">Mentés</button>
            <button id="refreshBtn" class="btn btn-ghost">Frissítés</button>
          </div>
        </div>
      </div>

      <footer>Worker backendre optimalizált frontend</footer>
    </div>
  </div>

  <script>
    // Backend URL-ek (nyuszilevelezo)
    const backendGet = "https://redirect-project.nyuszilevelezo.workers.dev/getUrl";
    const backendSet = "https://redirect-project.nyuszilevelezo.workers.dev/setUrl";

    // Elemei
    const currentUrlEl = document.getElementById("currentUrl");
    const newUrlInput = document.getElementById("newUrl");
    const messageEl = document.getElementById("message");
    const statusEl = document.getElementById("status");

    const saveBtn = document.getElementById("saveBtn");
    const redirectBtn = document.getElementById("redirectBtn");
    const copyBtn = document.getElementById("copyBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const openWorkerBtn = document.getElementById("openWorkerBtn");

    let cachedUrl = null;
    let messageTimeout = null;

    // Segédfetch
    async function safeFetch(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const text = await res.text();
        let body = null;
        try { body = JSON.parse(text); } catch { body = text; }
        return { ok: res.ok, status: res.status, body };
      } catch (err) {
        return { ok: false, error: err.message || String(err) };
      }
    }

    // Üzenet kezelése: ha "Másolva", 5s után eltűnik
    function showMessage(text, type = "") {
      clearTimeout(messageTimeout);
      messageEl.textContent = text;
      messageEl.className = "message" + (type ? " " + type : "");
      if (text === "Másolva.") {
        messageTimeout = setTimeout(() => {
          // csak akkor töröljük, ha még mindig ugyanaz az üzenet
          if (messageEl.textContent === "Másolva.") {
            messageEl.textContent = "";
            messageEl.className = "message";
          }
        }, 5000);
      }
    }

    // Betölti a jelenlegi URL-t
    async function loadCurrentUrl() {
      statusEl.textContent = "Státusz: ellenőrzés…";
      statusEl.style.color = "#2563eb";

      const res = await safeFetch(backendGet, { method: "GET", cache: "no-store" });

      if (!res.ok) {
        currentUrlEl.textContent = "Nem elérhető";
        statusEl.textContent = "Státusz: offline";
        statusEl.style.color = "#dc2626";
        showMessage("A backend nem válaszolt.", "err");
        return;
      }

      const data = res.body;
      const url = (data && data.url) ? data.url : null;
      cachedUrl = url;
      currentUrlEl.textContent = url || "Nincs beállítva";
      statusEl.textContent = "Státusz: online";
      statusEl.style.color = "#16a34a";
      showMessage("", "");
    }

    // Mentés
    async function saveUrl() {
      const newUrl = newUrlInput.value.trim();
      if (!newUrl) {
        showMessage("Adj meg egy URL-t.", "err");
        return;
      }

      showMessage("Mentés folyamatban…");
      const res = await safeFetch(backendSet, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: newUrl })
      });

      if (!res.ok) {
        showMessage("Mentés sikertelen.", "err");
        return;
      }

      showMessage("Sikeres mentés.", "ok");
      newUrlInput.value = "";
      await loadCurrentUrl();
    }

    // Átirányítás most
    function redirectNow() {
      if (!cachedUrl) {
        showMessage("Nincs beállított URL.", "err");
        return;
      }
      try {
        const u = new URL(cachedUrl);
        window.location.href = u.href;
      } catch {
        showMessage("A beállított URL érvénytelen.", "err");
      }
    }

    // Másolás vágólapra
    async function copyToClipboard() {
      if (!cachedUrl) {
        showMessage("Nincs beállított URL.", "err");
        return;
      }
      try {
        await navigator.clipboard.writeText(cachedUrl);
        showMessage("Másolva.", "ok");
      } catch {
        showMessage("A böngésző nem engedélyezi a vágólap használatát.", "err");
      }
    }

    // Worker getUrl megnyitása
    function openWorkerGet() {
      window.open(backendGet, "_blank", "noopener");
    }

    // Események
    saveBtn.addEventListener("click", saveUrl);
    redirectBtn.addEventListener("click", redirectNow);
    copyBtn.addEventListener("click", copyToClipboard);
    refreshBtn.addEventListener("click", loadCurrentUrl);
    openWorkerBtn.addEventListener("click", openWorkerGet);

    // Induláskor
    (function init() {
      // Alapvető validáció: ha a backend URL-ek nincsenek átállítva, figyelmeztetünk
      if (backendGet.includes("YOUR_ACCOUNT") || backendSet.includes("YOUR_ACCOUNT")) {
        currentUrlEl.textContent = "Kérlek állítsd be a Worker URL-eket a kódban.";
        showMessage("Cseréld ki a backendGet és backendSet változókat a saját Worker címeidre.", "err");
        statusEl.textContent = "nincs konfigurálva";
        statusEl.style.color = "#dc2626";
        return;
      }

      loadCurrentUrl();
      // opcionális: időközönként frissítjük a státuszt
      setInterval(loadCurrentUrl, 60_000);
    })();
  </script>
</body>
</html>
