<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Átirányító oldal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    button {
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      color: red;
    }
  </style>
</head>
<body>

  <h2>Átirányító oldal</h2>

  <p>Jelenlegi átirányítási URL:</p>
  <p id="currentUrl">Betöltés...</p>
  <button onclick="redirect()">Átirányítás</button>

  <h3>Új átirányítási URL beállítása</h3>
  <input id="newUrl" type="text" placeholder="Új URL..." />
  <button onclick="saveUrl()">Mentés</button>

  <p id="status"></p>

  <script>
    const backendGet = "https://redirect-project-hyo3.onrender.com/getUrl";
    const backendSet = "https://redirect-project-hyo3.onrender.com/setUrl";

    // 🟦 WAKE-UP PING — felébreszti a Render backendet
    (async () => {
      try {
        await fetch(backendGet, { method: "GET" });
      } catch (e) {
        // A hiba nem számít, a lényeg hogy a backend ébredjen
      }
    })();

    async function loadUrl() {
      try {
        const res = await fetch(backendGet);
        const data = await res.json();
        window.redirectUrl = data.url;
        document.getElementById("currentUrl").innerText = data.url;
      } catch (err) {
        document.getElementById("currentUrl").innerText = "Hiba történt.";
      }
    }

    async function saveUrl() {
      const newUrl = document.getElementById("newUrl").value.trim();
      if (!newUrl) {
        document.getElementById("status").innerText = "Adj meg egy URL-t!";
        return;
      }

      document.getElementById("status").innerText = "Mentés folyamatban...";

      try {
        const res = await fetch(backendSet, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: newUrl })
        });

        if (!res.ok) throw new Error("Hálózati hiba");

        document.getElementById("status").innerText = "Sikeres mentés!";
        loadUrl();
      } catch (err) {
        document.getElementById("status").innerText =
          "A mentés nem sikerült. Részletek: Failed to fetch";
      }
    }

    function redirect() {
      if (window.redirectUrl) {
        window.location.href = window.redirectUrl;
      }
    }

    loadUrl();
  </script>

</body>
</html>
