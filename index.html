<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Átirányító kezelő</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --accent: #2563eb;
      --accent-light: #dbeafe;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #dc2626;
      --success: #16a34a;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: var(--accent-light);
      border: 1px solid var(--accent);
      display: inline-block;
      font-weight: 600;
      color: var(--accent);
    }

    label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
      color: var(--muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      margin-bottom: 14px;
    }

    .current-url-box {
      background: #f9fafb;
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 10px;
      word-break: break-all;
      margin-bottom: 20px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
    }

    .ok { color: var(--success); }
    .err { color: var(--danger); }

    footer {
      margin-top: 20px;
      text-align: right;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .btn-row { flex-direction: column; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Átirányító kezelő</h1>
      <div class="subtitle">Cloudflare Worker alapú backend — gyors, stabil, nem alszik.</div>

      <div id="status" class="status-box">Státusz: ellenőrzés…</div>

      <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--border);" />

      <label>Jelenlegi átirányítási URL</label>
      <div id="currentUrl" class="current-url-box">Betöltés…</div>

      <label>Új átirányítási URL</label>
      <input id="newUrl" type="text" placeholder="https://pelda.hu" />

      <div class="btn-row">
        <button id="saveBtn" class="btn-primary">Mentés</button>
        <button id="testBtn" class="btn-secondary">Teszt megnyitás</button>
        <button id="refreshBtn" class="btn-secondary">Frissít</button>
      </div>

      <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--border);" />

      <label>Gyors műveletek</label>
      <div class="btn-row">
        <button id="redirectBtn" class="btn-primary">Átirányítás most</button>
        <button id="copyBtn" class="btn-secondary">URL másolása</button>
        <button id="openWorkerBtn" class="btn-secondary">Worker getUrl megnyitása</button>
      </div>

      <div id="message" class="message"></div>

      <footer>Worker backendre optimalizált frontend</footer>
    </div>
  </div>

  <script>
    const backendGet = "https://redirect-project.nyuszilevelezo.workers.dev/getUrl";
    const backendSet = "https://redirect-project.nyuszilevelezo.workers.dev/setUrl";

    const currentUrlEl = document.getElementById("currentUrl");
    const newUrlInput = document.getElementById("newUrl");
    const messageEl = document.getElementById("message");
    const statusEl = document.getElementById("status");

    const saveBtn = document.getElementById("saveBtn");
    const redirectBtn = document.getElementById("redirectBtn");
    const copyBtn = document.getElementById("copyBtn");
    const testBtn = document.getElementById("testBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const openWorkerBtn = document.getElementById("openWorkerBtn");

    let cachedUrl = null;

    async function safeFetch(url, options = {}) {
      try {
        const res = await fetch(url, options);
        const text = await res.text();
        let body = null;
        try { body = JSON.parse(text); } catch { body = text; }
        return { ok: res.ok, status: res.status, body };
      } catch (err) {
        return { ok: false, error: err.message };
      }
    }

    async function loadCurrentUrl() {
      statusEl.textContent = "Státusz: ellenőrzés…";
      statusEl.style.color = "#2563eb";

      const res = await safeFetch(backendGet);

      if (!res.ok) {
        currentUrlEl.textContent = "Nem elérhető";
        statusEl.textContent = "Státusz: offline";
        statusEl.style.color = "#dc2626";
        return;
      }

      cachedUrl = res.body.url || null;
      currentUrlEl.textContent = cachedUrl || "Nincs beállítva";
      statusEl.textContent = "Státusz: online";
      statusEl.style.color = "#16a34a";
    }

    async function saveUrl() {
      const newUrl = newUrlInput.value.trim();
      if (!newUrl) {
        messageEl.textContent = "Adj meg egy URL-t.";
        messageEl.className = "message err";
        return;
      }

      const res = await safeFetch(backendSet, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: newUrl })
      });

      if (!res.ok) {
        messageEl.textContent = "Mentés sikertelen.";
        messageEl.className = "message err";
        return;
      }

      messageEl.textContent = "Sikeres mentés.";
      messageEl.className = "message ok";
      newUrlInput.value = "";
      loadCurrentUrl();
    }

    function redirectNow() {
      if (!cachedUrl) {
        messageEl.textContent = "Nincs beállított URL.";
        messageEl.className = "message err";
        return;
      }
      window.location.href = cachedUrl;
    }

    async function copyToClipboard() {
      if (!cachedUrl) {
        messageEl.textContent = "Nincs URL.";
        messageEl.className = "message err";
        return;
      }
      await navigator.clipboard.writeText(cachedUrl);
      messageEl.textContent = "Másolva.";
      messageEl.className = "message ok";
    }

    function openTest() {
      if (!cachedUrl) return;
      window.open(cachedUrl, "_blank");
    }

    function openWorkerGet() {
      window.open(backendGet, "_blank");
    }

    saveBtn.onclick = saveUrl;
    redirectBtn.onclick = redirectNow;
    copyBtn.onclick = copyToClipboard;
    testBtn.onclick = openTest;
    refreshBtn.onclick = loadCurrentUrl;
    openWorkerBtn.onclick = openWorkerGet;

    loadCurrentUrl();
  </script>
</body>
</html>
